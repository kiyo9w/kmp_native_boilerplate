name: Build Android

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 21
      - name: Shared JVM tests
        run: ./gradlew :shared:jvmTest --stacktrace
      - name: Android debug build
        run: ./gradlew :androidApp:assembleDebug --stacktrace
