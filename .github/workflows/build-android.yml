name: Build Android

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 21
      - name: Shared tests
        run: ./gradlew :shared:allTests --stacktrace
      - name: Android debug build
        run: ./gradlew :androidApp:assembleDebug --stacktrace
